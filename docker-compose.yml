version: "3.8"

services:
  jakarta-munch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakarta-munch
    ports:
      - "3002:80"
    networks:
      - jakarta-munch-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  jakarta-munch-net:
    driver: bridge

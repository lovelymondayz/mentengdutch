version: "3.8"

services:
  jakarta-munch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakarta-munch
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3002:80"
    networks:
      - jakarta-munch-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  jakarta-munch-net:
    driver: bridge

volumes:
  mentengdutch-data:
    driver: local
